[project]
name = "handbook-beaker"
version = "0.0.1"
description = "Runtime dependencies for the HANDBOOK Beaker integration"
requires-python = ">=3.13"
dependencies = [
  "fastmcp>=3,<4",
  "pydantic[email]>=2.12.5",
  "starlette>=0.50",
  "uvicorn>=0.38",
  "openai",
  "openpyxl",
  "pdfplumber",
  "python-docx",
]

[dependency-groups]
dev = ["beaker-sdk==0.6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
